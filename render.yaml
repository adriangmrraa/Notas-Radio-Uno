# Blueprint Render — PeriodistApp (API + frontend estático servido por Express).
# NOTA Remotion: el render de clipService (Remotion) requiere Chromium, que el
# runtime de Render no instala. Los clip_render_jobs productivos
# (cut/reframe/subtitles) son puro ffmpeg — sí funcionan acá. El render
# Remotion queda opt-in local (ver docs/EPICA-J.md).
services:
  - type: web
    name: notas-radio-uno
    runtime: node
    plan: starter
    region: oregon
    buildCommand: |
      curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux -o ./yt-dlp && chmod +x ./yt-dlp &&
      curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar xJ --strip-components=1 --wildcards '*/ffmpeg' &&
      npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Rol del proceso: all = API+WS+schedulers+workers en un solo proceso.
      # Separar en api|worker requiere un segundo servicio Render y un
      # adapter de sockets (hoy los eventos de workers no llegan a clientes).
      - key: PROCESS_ROLE
        value: all
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_CONFIG_ID
        sync: false
      - key: VITE_META_APP_ID
        sync: false
      - key: VITE_META_CONFIG_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_FOLDER_ID
        sync: false
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      - key: GOOGLE_SEARCH_CX
        sync: false
      - key: TWITTER_APP_KEY
        sync: false
      - key: TWITTER_APP_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_SECRET
        sync: false
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: PLATFORM_NAME
        sync: false
      - key: SYSTEM_TENANT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
